<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23101214'/%3E%3Crect x='8' y='12' width='16' height='8' rx='4' fill='%23C9F03C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#EDEFF2;color:#101214;font-family:"Golos Text",system-ui,sans-serif;background-image:radial-gradient(circle,#BDC3CC 1.2px,transparent 1.4px);background-size:22px 22px}
.box{max-width:520px;padding:40px 24px;text-align:left}
.bubble{display:inline-block;background:#fff;border-radius:4px 16px 16px 16px;padding:14px 18px;font-size:17px;box-shadow:0 10px 30px rgba(16,18,20,.1)}
.bubble.out{background:#101214;color:#fff;border-radius:16px 4px 16px 16px;margin-top:10px}
h1{font-family:"Unbounded",sans-serif;font-size:26px;margin:28px 0 10px;letter-spacing:-.01em}
p{color:#4A5260;margin:0 0 24px}
a.btn{display:inline-block;background:#101214;color:#fff;text-decoration:none;font-family:"Unbounded",sans-serif;font-weight:600;font-size:14px;padding:14px 24px;border-radius:999px}
a.btn:hover{background:#C9F03C;color:#101214}
</style>
</head>
<body>
<div class="box">
  <div class="bubble">Здравствуйте, а где страница?</div><br>
  <div class="bubble out">Такой страницы нет. Передаю вас на главную.</div>
  <h1>Страница не найдена</h1>
  <p>Ссылка устарела или в адресе опечатка. Всё главное про AI-продавца на одной странице.</p>
  <a class="btn" href="/">На главную</a>
</div>
</body>
</html>
